<!DOCTYPE html>
<script>
  class Project {
    constructor(name, year, org, role, link, lang, desc) {
      this.name = name; this.year = year; this.org= org; this.role = role; this.link = link; this.lang = lang; this.desc = desc;
    }

    MakeElem() {
      console.log("making project element - " + this.name);
      const item = document.createElement("li")
      item.setAttribute("class", ".proj-list-item");

      const frag = document.createDocumentFragment();
      const art = document.createElement("article");
      art.setAttribute("class", ".proj-art");

      const name = document.createElement("h3");
      name.innerHTML = this.name;
      name.setAttribute("class", ".proj-name");
      frag.appendChild(name);

      const year = document.createElement("h4");
      year.innerHTML = this.year;
      year.setAttribute("class", ".proj-year");
      frag.appendChild(year);

      const org = document.createElement("h4");
      org.innerHTML = this.org.abbr;
      org.setAttribute("class", ".proj-org " + ".org-" + org);
      frag.appendChild(org);

      const role = document.createElement("h4");
      role.innerHTML = this.role;
      org.setAttribute("class", ".proj-role");
      frag.appendChild(role);

      if (this.link != "") {
        const link = document.createElement("a");
        link.innerHTML = this.name;
        link.setAttribute("target", "_blank");
        link.href = this.link;
        link.setAttribute("class", ".proj-link");
        frag.appendChild(link);
      }

      if (this.lang != "") {
        const lang = document.createElement("p");
        lang.innerHTML = this.lang;
        lang.setAttribute("class", ".proj-lang");
        frag.appendChild(lang);
      }

      if (this.desc != "") {
        const desc = document.createElement("p");
        desc.innerHTML = this.desc;
        desc.setAttribute("class", ".proj-desc");
        frag.appendChild(desc);
      }

      // add to list
      const projectsList = document.getElementById("projects-list");
      art.appendChild(frag);
      item.appendChild(art);
      projectsList.appendChild(item);
    }
  }
